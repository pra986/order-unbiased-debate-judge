[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-unbiased-debate-judge"
version = "0.1.0"
description = "Project 34: CrewAI debate evaluation harness eliminating LLM positional preference bias via order-swapped dual-judge passes and an explicit 3-axis evidence rubric."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
crewai = [
    "crewai>=0.80.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
debate-judge = "debate_judge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
